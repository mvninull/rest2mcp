name: Publish r2mcp to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build package
        working-directory: r2mcp-cli
        run: |
          python -m pip install --upgrade pip build
          python prepare_build.py
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: r2mcp-cli/dist

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist