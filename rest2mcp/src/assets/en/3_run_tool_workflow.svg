<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:DM Sans, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">A @run_tool card contains the chained script diagram: search checks the product; if it exists, it goes right at a right angle to add, send and update until success; if not, it goes left and returns product out of stock. The result exits run_tool to the LLM, which responds to the user.</desc>
