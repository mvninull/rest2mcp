<svg width="100%" viewBox="0 0 680 420" role="img" style="" xmlns="http://www.w3.org/2000/svg">
<title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:DM Sans, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Autenticação sem expor credenciais à IA</title>
<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:DM Sans, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Login por CLI ou dashboard web gera um token de sessão que vive só em memória, injetado nas chamadas reais da API. A LLM apenas chama tools e recebe dados, nunca vê o token.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>


